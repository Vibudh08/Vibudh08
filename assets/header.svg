<svg xmlns="http://www.w3.org/2000/svg" width="846" height="235" viewBox="0 0 846 235" role="img" aria-label="Vibudh Rathore - Full Stack Developer">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#101a38;#0d1117" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.52" stop-color="#0b5fff">
        <animate attributeName="stop-color" values="#0b5fff;#2563eb;#7c3aed;#0b5fff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#6f42c1">
        <animate attributeName="stop-color" values="#6f42c1;#9333ea;#4f46e5;#6f42c1" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="type1"><rect x="110" y="147" width="0" height="30"><animate attributeName="width" values="0;626;626;0;0" keyTimes="0;0.12;0.22;0.245;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type2"><rect x="110" y="147" width="0" height="30"><animate attributeName="width" values="0;0;626;626;0;0" keyTimes="0;0.25;0.37;0.47;0.495;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type3"><rect x="110" y="147" width="0" height="30"><animate attributeName="width" values="0;0;626;626;0;0" keyTimes="0;0.50;0.62;0.72;0.745;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type4"><rect x="110" y="147" width="0" height="30"><animate attributeName="width" values="0;0;626;626;0" keyTimes="0;0.75;0.87;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="846" height="235" rx="20" fill="url(#g)"/>

  <circle cx="690" cy="34" r="120" fill="url(#glow)">
    <animate attributeName="cx" values="690;735;690" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="r" values="110;145;110" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="205" r="115" fill="#60a5fa" opacity="0.08" filter="url(#softGlow)">
    <animate attributeName="cx" values="120;190;120" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.24" fill="none" stroke="#ffffff">
    <path d="M24 190 C170 105 255 225 408 144 S635 74 826 132">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M24 190 C170 105 255 225 408 144 S635 74 826 132;M24 176 C165 128 272 204 416 132 S660 92 826 118;M24 190 C170 105 255 225 408 144 S635 74 826 132"/>
    </path>
    <path d="M52 45 C208 4 294 106 438 60 S650 16 805 61">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M52 45 C208 4 294 106 438 60 S650 16 805 61;M52 58 C210 22 300 88 446 73 S662 30 805 48;M52 45 C208 4 294 106 438 60 S650 16 805 61"/>
    </path>
  </g>

  <g>
    <text x="423" y="86" text-anchor="middle" fill="#ffffff" font-size="46" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" opacity="0">
      Vibudh Rathore
      <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.9s" fill="freeze"/>
    </text>

    <text x="423" y="124" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" opacity="0">
      Full Stack Developer
      <animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.8s" fill="freeze"/>
    </text>
  </g>

  <g fill="#dbeafe" font-size="15" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace">
    <text x="423" y="166" text-anchor="middle" clip-path="url(#type1)">Next.js · React · Node.js · TypeScript</text>
    <text x="423" y="166" text-anchor="middle" clip-path="url(#type2)">Building SaaS, e-commerce &amp; workflow products</text>
    <text x="423" y="166" text-anchor="middle" clip-path="url(#type3)">Performance Optimization · Core Web Vitals</text>
    <text x="423" y="166" text-anchor="middle" clip-path="url(#type4)">Authentication · Payments · Automation</text>
  </g>

  <rect x="727" y="149" width="2" height="21" rx="1" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(423 203)">
    <circle cx="-13" cy="0" r="3" fill="#93c5fd"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="0" r="3" fill="#c4b5fd"><animate attributeName="opacity" values="0.35;1;0.35" begin="0.2s" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="13" cy="0" r="3" fill="#f0abfc"><animate attributeName="opacity" values="0.35;1;0.35" begin="0.4s" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
