<svg xmlns="http://www.w3.org/2000/svg" width="430" height="165" viewBox="0 0 430 165" role="img" aria-labelledby="eventora-title eventora-description">
  <title id="eventora-title">Eventora</title>
  <desc id="eventora-description">Event booking platform with bookings, cancellations, seat tracking, Razorpay payments and user and admin dashboards. Built with React, Node.js, Express, MongoDB and JWT authentication.</desc>
  <rect width="430" height="165" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="28" cy="31" r="7" fill="#58a6ff"/>
  <text x="45" y="38" fill="#58a6ff" font-size="20" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Eventora</text>
  <text x="24" y="72" fill="#c9d1d9" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Event bookings, cancellations and seat tracking.</text>
  <text x="24" y="94" fill="#c9d1d9" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Razorpay payments with user / admin dashboards.</text>
  <circle cx="28" cy="132" r="6" fill="#f1e05a"/>
  <text x="42" y="137" fill="#8b949e" font-size="13" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">React · Node.js · Express · MongoDB · JWT</text>
</svg>
